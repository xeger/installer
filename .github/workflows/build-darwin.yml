name: Build Darwin

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag to upload artifacts to (empty means CI build)'
        required: false
        default: ''
        type: string

jobs:
  build-darwin:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Darwin PKG
        run: |
          ./scripts/build-darwin.sh ${{ inputs.release_tag || github.ref_name || 'dev' }}

      - name: Upload to release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ inputs.release_tag }} dist/*.pkg --clobber
