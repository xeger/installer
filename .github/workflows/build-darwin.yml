name: Build Darwin

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag to stamp into the package (empty means CI build)'
        required: false
        default: ''
        type: string

jobs:
  build-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build PKG
        run: ./scripts/build-darwin.sh "${{ inputs.release_tag || 'dev' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-pkg
          path: 'dist/*.pkg'
