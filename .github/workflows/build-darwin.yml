name: Build Darwin

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag to upload artifacts to (empty means CI build)'
        required: false
        default: ''
        type: string
      release_channel:
        description: 'Repository for release channel'
        required: false
        default: ''
        type: string

jobs:
  build-darwin:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Darwin PKG
        run: |
          ./scripts/build-darwin.sh "${{ inputs.release_tag || github.ref_name || 'dev' }}" "${{ inputs.release_channel }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: darwin-pkg
          path: 'dist/*.pkg'
