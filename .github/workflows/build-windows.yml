name: Build Windows

on:
  workflow_call:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install WiX
        run: dotnet tool install --global wix

      - name: Build Windows MSI
        run: |
          .\scripts\build-windows.ps1 -Version "$env:GITHUB_REF_NAME"
