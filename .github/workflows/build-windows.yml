name: Build Windows

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag to upload artifacts to (empty means CI build)'
        required: false
        default: ''
        type: string

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install WiX
        run: dotnet tool install --global wix

      - name: Build Windows MSI
        run: |
          .\scripts\build-windows.ps1 -Version "${{ inputs.release_tag || github.ref_name || 'dev' }}"

      - name: Upload artifacts for CI
        if: ${{ inputs.release_tag == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: '*.msi'

      - name: Upload to release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.release_tag }}
          files: '*.msi'
