name: Build Windows

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag to upload artifacts to (empty means CI build)'
        required: false
        default: ''
        type: string
      release_channel:
        description: 'Repository for release channel'
        required: false
        default: ''
        type: string

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install WiX
        run: dotnet tool install --global wix

      - name: Build Windows MSI
        run: |
          .\scripts\build-windows.ps1 -Version "${{ inputs.release_tag || github.ref_name || 'dev' }}" -Repository "${{ inputs.release_channel }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: 'dist/*.msi'
