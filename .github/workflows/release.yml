name: Release

on:
  release:
    types: [published]

permissions:
  contents: write  # Required for uploading assets

jobs:
  build-archives:
    uses: ./.github/workflows/build-archives.yml
    with:
      release_tag: ${{ github.event.release.tag_name }}

  build-darwin:
    uses: ./.github/workflows/build-darwin.yml
    with:
      release_tag: ${{ github.event.release.tag_name }}

  build-windows:
    uses: ./.github/workflows/build-windows.yml
    with:
      release_tag: ${{ github.event.release.tag_name }}

  publish:
    needs: [build-archives, build-darwin, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true
      - name: Upload installers and archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" ./artifacts/* --clobber --repo "${{ github.repository }}"
