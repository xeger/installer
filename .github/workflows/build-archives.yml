name: Build Archives

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag to stamp into the binaries (empty means CI build)'
        required: false
        default: ''
        type: string

jobs:
  build-archives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build static archives for all platforms
        run: ./scripts/build-archives.sh "${{ inputs.release_tag || 'dev' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: archives
          path: 'dist/*.tar.gz'
