name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review re-runs CI when a draft (which skips the builds) is
    # marked ready, so gate: build can't pass on skipped builds alone.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./... && GOOS=windows go vet ./... && GOOS=darwin go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...

  build-archives:
    uses: ./.github/workflows/build-archives.yml

  build-darwin:
    # macOS runners are expensive; don't waste cycles!
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    uses: ./.github/workflows/build-darwin.yml

  build-windows:
    # Windows runners are expensive; don't waste cycles!
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    uses: ./.github/workflows/build-windows.yml

  # Gates: one check per category (what branch protection requires). Each
  # passes only if every job in its category succeeded or was deliberately
  # skipped, so jobs can be added or renamed without touching protection.

  gate-lint:
    name: "gate: lint"
    if: always()
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null

  gate-test:
    name: "gate: test"
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null

  gate-build:
    name: "gate: build"
    if: always()
    needs: [build-archives, build-darwin, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
